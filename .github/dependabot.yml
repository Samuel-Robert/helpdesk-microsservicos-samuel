version: 2
updates:
  # Cada serviço tem as próprias dependências e o próprio Dockerfile
  - package-ecosystem: pip
    directories: ["/servicos/*"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/servicos/*"]
    schedule:
      interval: weekly
