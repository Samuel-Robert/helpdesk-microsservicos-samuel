name: Testes e segurança
on: [push, pull_request]

# O workflow só pode ler o código (privilégio mínimo)
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Testes (inclui testes de segurança)
        run: pytest -q
      - name: Dependências com falhas conhecidas
        run: for r in requirements.txt servicos/*/requirements.txt; do pip-audit -r "$r" || exit 1; done
