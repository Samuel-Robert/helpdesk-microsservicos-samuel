[pytest]
# Cada serviço é um pacote com o próprio nome; a raiz traz a pasta comum/.
pythonpath = . servicos/usuarios servicos/inventario servicos/chamados servicos/gateway
testpaths = servicos
# Os serviços têm arquivos de teste com o mesmo nome (test_seguranca.py): importlib evita a colisão
addopts = --import-mode=importlib
